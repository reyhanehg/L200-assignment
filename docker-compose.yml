version: '3.8'

services:
  nutri-ui:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      - DATA_DIR=/app/data
      - LOG_LEVEL=INFO
      - ENABLE_TRACING=true
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  nutri-api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "src.ui.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/app/data
      - LOG_LEVEL=INFO
      - ENABLE_TRACING=true
    volumes:
      - ./data:/app/data
    restart: unless-stopped
